# Example host nginx for a VPS (HTTPS is required for PWA install and the Service Worker).
#   1. docker compose up -d           (web container listens on 127.0.0.1:8080, set WEB_PORT=127.0.0.1:8080)
#   2. sudo certbot --nginx -d bannerka.example.com
#   3. copy this file to /etc/nginx/sites-available/bannerka and enable it

server {
  listen 80;
  server_name bannerka.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name bannerka.example.com;

  ssl_certificate     /etc/letsencrypt/live/bannerka.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bannerka.example.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 1100m;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # SSE progress + large uploads
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
  }
}
