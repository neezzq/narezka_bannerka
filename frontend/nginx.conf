# Serves the PWA and proxies the API. Media files are streamed by nginx itself
# through X-Accel-Redirect (the API only checks the id and sets headers).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Re-resolve the api container through Docker DNS: its IP changes whenever it is
  # recreated, and a static upstream would keep answering 502 until web restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  client_max_body_size 1100m;
  client_body_timeout 300s;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com https://player.twitch.tv https://embed.twitch.tv 'unsafe-inline'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.twitch.tv https://clips.twitch.tv; img-src 'self' data: blob: https://*.ytimg.com https://*.jtvnw.net https://*.twitch.tv https://*.tiktokcdn.com https://*.tiktokcdn-us.com; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  location /api/jobs/ {
    # Server-Sent Events: no buffering, long timeouts
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # internal: files are only reachable through X-Accel-Redirect from the API
  location /_protected/ {
    internal;
    alias /data/storage/;
    add_header Accept-Ranges bytes;
    add_header Cache-Control "private, max-age=86400, immutable";
    add_header X-Content-Type-Options nosniff;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /fonts/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }
  location / {
    try_files $uri /index.html;
  }
}
